<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="directory.css">
<style>
  html,body{width:390px;}
  body{max-height:560px;overflow-y:auto;overflow-x:hidden;}
  .kd-sheet{padding:16px 16px 12px;}
  .kd-mast{margin-bottom:14px;}
  .kd-mast h1{font-size:1.5rem;margin-bottom:0;}
  .kd-dek,.kd-byline,.kd-foot{display:none;}
  .kd-index{columns:1;}
  .kd-entry{margin-bottom:1.15rem;}
  .kd-list a{font-size:.98rem;padding:.18rem .4rem;margin-left:-.4rem;}
  .kd-pbar{
    display:flex;gap:8px;justify-content:space-between;align-items:center;
    padding:10px 16px;border-top:1px solid var(--hair);
    font-family:system-ui,"Segoe UI",Roboto,sans-serif;
  }
  .kd-pbar button{
    font:inherit;font-size:.76rem;cursor:pointer;border:1px solid var(--hair-strong);
    background:transparent;color:var(--ink);border-radius:999px;padding:.34rem .7rem;
  }
  .kd-pbar button:hover{border-color:var(--ink-soft);}
</style>
</head>
<body>
  <main id="app"></main>
  <div class="kd-pbar">
    <button id="kd-open-newtab" type="button">Yeni sekmede ac</button>
    <button id="kd-open-admin" type="button">Yonetim paneli</button>
  </div>

  <script src="defaults.js"></script>
  <script src="render.js"></script>
  <script src="popup.js"></script>
</body>
</html>
